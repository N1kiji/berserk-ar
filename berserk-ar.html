<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BERSERK — AR Scanner</title>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; font-family: 'Arial Black', sans-serif; overflow: hidden; }

        #loading {
            position: fixed; inset: 0; background: #000;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 9999; color: #fff;
        }
        #loading h1 { font-size: 28px; letter-spacing: 6px; text-transform: uppercase; margin-bottom: 8px; }
        #loading p { font-size: 12px; color: #666; letter-spacing: 2px; margin-bottom: 32px; }
        .loader {
            width: 48px; height: 48px;
            border: 3px solid #222; border-top-color: #fff;
            border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #instructions {
            position: fixed; inset: 0; background: #000;
            display: none; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 9998; color: #fff; padding: 32px; text-align: center;
        }
        #instructions h2 { font-size: 20px; letter-spacing: 5px; margin-bottom: 10px; }
        #instructions p { font-size: 13px; color: #888; line-height: 1.7; margin-bottom: 32px; max-width: 280px; }
        #startBtn {
            background: #fff; color: #000; border: none;
            padding: 14px 44px; font-size: 13px; font-weight: 900;
            letter-spacing: 4px; text-transform: uppercase;
            cursor: pointer; border-radius: 2px;
        }

        #hint {
            position: fixed; bottom: 36px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.75); color: #fff;
            padding: 10px 22px; border-radius: 2px;
            font-size: 11px; letter-spacing: 3px;
            text-transform: uppercase; z-index: 9997;
            border: 1px solid rgba(255,255,255,0.15);
            display: none;
        }

        #found-overlay {
            position: fixed; inset: 0; z-index: 9999;
            display: none; flex-direction: column;
            align-items: center; justify-content: center;
            background: rgba(0,0,0,0.7);
        }
        #found-overlay .ring {
            width: 130px; height: 130px; border-radius: 50%;
            border: 2px solid #fff; margin-bottom: 24px;
            animation: ringPulse 1.2s ease-out infinite;
        }
        @keyframes ringPulse {
            0% { opacity: 1; transform: scale(0.95); }
            100% { opacity: 0; transform: scale(1.25); }
        }
        #found-overlay p {
            color: #fff; font-size: 11px; letter-spacing: 4px;
            text-transform: uppercase; margin-bottom: 24px; opacity: 0.8;
        }
        #found-overlay a {
            background: #fff; color: #000;
            padding: 14px 40px; font-weight: 900;
            font-size: 13px; letter-spacing: 4px;
            text-transform: uppercase; text-decoration: none;
            border-radius: 2px;
        }

        a-scene { display: none; }
    </style>
</head>
<body>

<div id="loading">
    <h1>BERSERK</h1>
    <p>FIGHT CLUB · AR</p>
    <div class="loader"></div>
</div>

<div id="instructions">
    <h2>AR SCANNER</h2>
    <p>Наведи камеру на логотип BERSERK — и попадёшь прямо на сайт клуба</p>
    <button id="startBtn" onclick="startAR()">ЗАПУСТИТЬ СКАНЕР</button>
</div>

<div id="hint">НАВЕДИ НА ЛОГОТИП</div>

<div id="found-overlay">
    <div class="ring"></div>
    <p>ЛОГОТИП РАСПОЗНАН</p>
    <a href="https://berserk-fight-club.ru/">ПЕРЕЙТИ НА САЙТ</a>
</div>

<a-scene
    id="arScene"
    mindar-image="imageTargetSrc: https://n1kiji.github.io/berserk-ar/targets.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity mindar-image-target="targetIndex: 0" id="target0">
        <a-plane width="1" height="1" opacity="0" id="triggerPlane"></a-plane>
    </a-entity>
</a-scene>

<script>
    window.addEventListener('load', function() {
        setTimeout(function() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('instructions').style.display = 'flex';
        }, 1500);
    });

    function startAR() {
        document.getElementById('instructions').style.display = 'none';
        document.getElementById('hint').style.display = 'block';

        const scene = document.getElementById('arScene');
        scene.style.display = 'block';

        scene.addEventListener('loaded', function() {
            const mindarSystem = scene.systems['mindar-image-system'];
            if (mindarSystem) {
                mindarSystem.start();
            }
        });

        const target = document.getElementById('target0');

        target.addEventListener('targetFound', function() {
            document.getElementById('hint').style.display = 'none';
            const overlay = document.getElementById('found-overlay');
            overlay.style.display = 'flex';
            setTimeout(function() {
                window.location.href = 'https://berserk-fight-club.ru/';
            }, 2500);
        });

        target.addEventListener('targetLost', function() {
            document.getElementById('found-overlay').style.display = 'none';
            document.getElementById('hint').style.display = 'block';
        });
    }
</script>
</body>
</html>
